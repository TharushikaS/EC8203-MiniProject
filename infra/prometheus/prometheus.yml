global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Ingestion - streaming source (producer delivery metrics, injected faults)
  - job_name: meter-simulator
    static_configs: [{ targets: ["meter-simulator:8000"], labels: { stage: ingestion } }]

  # Ingestion - daily batch source (file drops)
  - job_name: tariff-simulator
    static_configs: [{ targets: ["tariff-simulator:8001"], labels: { stage: ingestion } }]

  # Kafka broker: per-partition offsets (throughput per partition)
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"], labels: { stage: ingestion } }]

  # Processing - Spark Structured Streaming driver (StreamingQueryListener metrics)
  - job_name: spark-speed-layer
    static_configs: [{ targets: ["spark-streaming:9108"], labels: { stage: processing } }]

  # Batch layer - metrics pushed by Airflow tasks after each run
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{ targets: ["pushgateway:9091"], labels: { stage: batch } }]

  # Serving - API request metrics + business / freshness gauges
  - job_name: serving-api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8080"], labels: { stage: serving } }]

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
